[package]
name = "rotating-proxy"
version = "0.1.0"
edition = "2021"
description = "Rotating residential proxy from local machine — Tor + Cloudflare Warp multi-port backend with auto IP rotation"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
socket2 = "0.5"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-util = "0.7"

[profile.release]
lto = true
strip = true
